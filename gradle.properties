# Gradle daemon and Kotlin daemon sized for a 16 GB machine / GitHub runner.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true
roborazzi.record.filePathStrategy=relativePathFromRoborazziContextOutputDirectory
