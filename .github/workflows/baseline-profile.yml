name: Baseline profile

# Manual only. Generates the baseline and startup profile on a Gradle Managed Device (Pixel 6,
# API 34, x86_64), runs the macrobenchmarks once as a smoke test, and opens a pull request with
# the regenerated profile. Emulator timings are not representative; see the module's KDoc.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: baseline-profile-${{ github.ref }}
  cancel-in-progress: true

env:
  GMD_FLAGS: >-
    -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

jobs:
  profile:
    name: Generate baseline profile
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Hosted Linux x64 runners have /dev/kvm, but the runner user cannot open it without this rule.
      # Without acceleration the emulator is far too slow, so the job stops instead of crawling.
      - name: Enable and verify KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::This runner has no /dev/kvm. Use an x64 Linux runner with nested virtualisation."
            exit 1
          fi
          ls -l /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::/dev/kvm exists but is not accessible to the runner user."
            exit 1
          fi
          echo "KVM available."

      - name: Generate the profile on the managed emulator
        run: ./gradlew :app:generateBaselineProfile $GMD_FLAGS

      - name: Macrobenchmarks (emulator smoke test)
        continue-on-error: true
        run: >-
          ./gradlew :baselineprofile:pixel6Api34BenchmarkReleaseAndroidTest $GMD_FLAGS
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR

      - name: Upload profile and benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profile
          path: |
            app/src/*/generated/baselineProfiles/
            baselineprofile/build/outputs/
          if-no-files-found: warn
          retention-days: 30

      - name: Open a pull request with the profile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -A -- app/src
          if git diff --cached --quiet; then
            echo "The profile did not change."
            exit 0
          fi
          git diff --cached --stat
          branch="baseline-profile/run-${GITHUB_RUN_ID}"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "chore(app): update baseline profile" -m "Generated by $run_url"
          git push origin "$branch"
          body="Regenerated baseline and startup profile from $run_url (Pixel 6, API 34 managed emulator, without Shizuku)."
          body+=$'\n\nPull requests opened with the workflow token do not start CI; close and reopen this one to run it.'
          if ! gh pr create --base "$GITHUB_REF_NAME" --head "$branch" --label maintenance \
                 --title "chore: update baseline profile" --body "$body"; then
            echo "::warning::Could not open the pull request. Allow it under Settings > Actions > General > Workflow permissions, or open one from branch $branch."
          fi
