name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Spotless, Lint, unit and screenshot tests, debug build
        run: >-
          ./gradlew
          spotlessCheck
          lint
          testDebugUnitTest
          :core:test
          :core:koverVerify
          verifyRoborazziDebug
          assembleDebug
          verifyNoInternetPermission

      - name: Verify the APK requests no INTERNET permission
        run: |
          set -euo pipefail
          shopt -s nullglob
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          apks=(app/build/outputs/apk/debug/*.apk)
          (( ${#apks[@]} > 0 )) || { echo "::error::No debug APK found"; exit 1; }
          for apk in "${apks[@]}"; do
            perms="$("$bt/aapt2" dump permissions "$apk")"
            echo "$perms"
            if grep -q "android.permission.INTERNET" <<< "$perms"; then
              echo "::error file=$apk::APK requests android.permission.INTERNET"
              exit 1
            fi
          done

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: picket-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 14
