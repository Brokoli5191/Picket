# Categories for GitHub-generated release notes (used by `gh release create --generate-notes`).
# Every PR gets exactly one of: feature, fix, maintenance.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features
      labels:
        - feature
    - title: Fixes
      labels:
        - fix
    - title: Maintenance
      labels:
        - maintenance
        - dependencies
    - title: Other changes
      labels:
        - "*"
